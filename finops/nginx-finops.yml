specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: NGINX
providerId: nginx
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - FinOps
  - FOCUS
  - API Gateway
  - Load Balancer
  - Cost Management
notes: F5 does not publicly post per-instance prices for NGINX Plus / NGINX One / WAF. FinOps shape
  inferred from typical instance-based subscription patterns and cloud-marketplace listings for NGINXaaS.
  Reconcile against the customer's F5 quote or Azure / GCP marketplace billing.
description: 'FOCUS-aligned FinOps for NGINX: open-source self-host is zero-cost; commercial F5 NGINX
  products billed per-instance annual subscription or via cloud marketplaces (NGINXaaS for Azure / GCP)
  with usage-based pricing.'
sources:
  - https://www.f5.com/products/nginx
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: F5, Inc.
serviceCategory: API Gateway + Load Balancer
billingModel:
  pricingCategory: Subscription + Marketplace Pay-As-You-Go
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Usage
    - Tax
    - Adjustment
focusColumns:
  ServiceName: NGINX
  ServiceCategory: Networking
  ServiceSubcategory: API Gateway / Load Balancer
  ProviderName: F5
  PublisherName: F5, Inc.
  InvoiceIssuerName: F5, Inc.
  BillingCurrency: USD
  PricingCategory: Subscription
  PricingUnit: instance-year
meters:
  - name: nginx_plus_instances
    description: Annual NGINX Plus instance subscriptions.
    unit: instance-year
    aggregation: sum
    dimensions:
      - region
      - environment
  - name: nginx_one_instances
    description: NGINX One managed instances.
    unit: instance-month
    aggregation: avg
    dimensions:
      - region
      - cluster
  - name: f5_waf_instances
    description: F5 WAF for NGINX subscription instances.
    unit: instance-year
    aggregation: sum
    dimensions:
      - region
      - environment
  - name: nginxaas_azure_usage
    description: NGINXaaS for Azure marketplace consumption.
    unit: hour
    aggregation: sum
    dimensions:
      - region
      - sku
  - name: nginxaas_gcp_usage
    description: NGINXaaS for Google Cloud marketplace consumption.
    unit: hour
    aggregation: sum
    dimensions:
      - region
      - sku
  - name: support_subscription
    description: F5 support tier subscription.
    unit: month
    aggregation: sum
    dimensions:
      - tier
principles:
  - name: Visibility
    description: Use NGINX One Console for fleet inventory; F5 Customer Support portal for license tracking;
      cloud-marketplace billing exports for NGINXaaS consumption.
  - name: Allocation
    description: Tag NGINX instances at the cloud / Kubernetes layer with team and application labels;
      use NGINX One projects to map to cost centers.
  - name: Optimization
    description: Run NGINX Open Source for non-mission-critical paths; reserve NGINX Plus for endpoints
      needing active health checks, JWT validation, and live monitoring; consolidate redundant gateways
      with multi-tenant configuration.
  - name: Accountability
    description: Set per-environment Plus / One license budgets; review unused or idle instances quarterly;
      validate that marketplace usage aligns with capacity-planning forecasts.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
