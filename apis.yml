- aid: nginx:nginx-gateway-fabric
  name: NGINX Gateway Fabric
  description: >-
    NGINX Gateway Fabric is a Kubernetes Gateway API implementation using NGINX as the data plane. It
    provides standards-based traffic management through Gateway API resources including Gateway, HTTPRoute,
    GRPCRoute, and TLSRoute, enabling fine-grained control over ingress and routing in Kubernetes environments.
