aid: nginx
name: NGINX
description: NGINX is a high-performance open-source web server, reverse proxy, and API gateway widely used for load balancing,
  SSL termination, caching, and traffic management for APIs and microservices. Originally written by Igor Sysoev and released
  under the 2-clause BSD license, NGINX powers a significant portion of the world's web traffic. Enterprise support and commercial
  features are available from F5, Inc.
