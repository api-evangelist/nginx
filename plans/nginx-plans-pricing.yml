notes: NGINX Open Source is free under the 2-clause BSD license. F5 (which owns NGINX) does not publish
  per-instance subscription pricing for NGINX Plus, NGINX One, NGINX App Protect, or F5 WAF for NGINX
  on its public site — pricing is contact-sales or via cloud marketplaces (NGINXaaS for Azure / Google
  Cloud). Reconcile via Azure Marketplace or Google Cloud Marketplace listings, or F5 sales quotes.
description: NGINX is open source under the 2-clause BSD license; the project is free to use and self-host.
  Commercial offerings from F5 include NGINX Plus (subscription per instance), NGINX One (the SaaS-managed
  data plane with observability/security), F5 WAF for NGINX, and NGINXaaS distributed via Azure and Google
  Cloud marketplaces. Public per-instance pricing is not posted on f5.com; customers obtain quotes via
  sales or marketplace listings.
sources:
  - https://www.f5.com/products/nginx
  - https://nginx.org/
plans:
