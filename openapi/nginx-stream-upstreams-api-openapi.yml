components:
  schemas:
    NginxStreamUpstream:
      title: Stream Upstream
      type: object
      properties:
        peers:
          $ref: '#/components/schemas/NginxStreamUpstreamPeerMap'
        zombies:
          type: integer
          description: The current number of servers removed from the group but still processing active client connections.
          example: 0
        zone:
          type: string
          description: The name of the shared memory <a href="https://nginx.org/en/docs/stream/ngx_stream_upstream_module.html#zone">zone</a> that keeps the group’s configuration and run-time state.
          example: example-zone
      example:
        dns:
          peers:
          - id: 0
            server: 10.0.0.1:12347
            name: 10.0.0.1:12347
            backup: false
            weight: 5
            state: up
            active: 0
            ssl:
              handshakes: 200
              handshakes_failed: 4
              session_reuses: 189
              no_common_protocol: 4
              handshake_timeout: 0
              peer_rejected_cert: 0
              verify_failures:
                expired_cert: 2
                revoked_cert: 1
                hostname_mismatch: 2
                other: 1
            max_conns: 50
            connections: 667231
            sent: 251946292
            received: 19222475454
            fails: 0
            unavail: 0
            health_checks:
              checks: 26214
              fails: 0
              unhealthy: 0
