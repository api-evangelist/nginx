    NginxStreamUpstreamPeer:
      title: Stream Upstream Server
      type: object
      properties:
        id:
          type: integer
          description: The ID of the server.
          readOnly: true
          example: 0
        server:
          type: string
          description: An <a href="https://nginx.org/en/docs/stream/ngx_stream_upstream_module.html#server">address</a> of the server.
          example: example-server
        service:
          type: string
          description: The <a href="https://nginx.org/en/docs/stream/ngx_stream_upstream_module.html#service">service</a> parameter value of the <a href="https://nginx.org/en/docs/stream/ngx_stream_upstream_module.html#server">server</a> directive.
          example: example-service
        name:
          type: string
          format: hostname
          description: The name of the server specified in the <a href="https://nginx.org/en/docs/stream/ngx_stream_upstream_module.html#server">server</a> directive.
          readOnly: true
          example: my_shared_zone
        backup:
          type: boolean
          description: A boolean value indicating whether the server is a <a href="https://nginx.org/en/docs/stream/ngx_stream_upstream_module.html#backup">backup</a> server.
          example: false
        weight:
          type: integer
          description: <a href="https://nginx.org/en/docs/stream/ngx_stream_upstream_module.html#weight">Weight</a> of the server.
          example: 0
        state:
          type: string
          readOnly: true
          enum:
          - up
          - down
          - unavail
          - checking
          - unhealthy
          description: Current state, which may be one of “<code>up</code>”, “<code>down</code>”, “<code>unavail</code>”, “<code>checking</code>”, or “<code>unhealthy</code>”.
          example: example-state
        active:
          type: integer
          description: The current number of connections.
          readOnly: true
          example: 5
        ssl:
          type: object
          readOnly: true
          properties:
            handshakes:
              type: integer
              description: The total number of successful SSL handshakes.
              readOnly: true
              example: 79572
            handshakes_failed:
              type: integer
              description: The total number of failed SSL handshakes.
              readOnly: true
              example: 21025
            session_reuses:
              type: integer
              description: The total number of session reuses during SSL handshake.
              readOnly: true
              example: 15762
            no_common_protocol:
              type: integer
              description: The number of SSL handshakes failed because of no common protocol.
              example: 4
            handshake_timeout:
              type: integer
              description: The number of SSL handshakes failed because of a timeout.
              example: 0
            peer_rejected_cert:
              type: integer
              description: The number of failed SSL handshakes when nginx presented the certificate to the upstream server but it was rejected with a corresponding alert message.
              example: 0
            verify_failures:
              type: object
              description: SSL certificate verification errors
              properties:
                expired_cert:
                  type: integer
                  description: An expired or not yet valid certificate was presented by an upstream server.
                  example: 2
                revoked_cert:
                  type: integer
                  description: A revoked certificate was presented by an upstream server.
                  example: 1
                hostname_mismatch:
                  type: integer
                  description: Server's certificate doesn't match the hostname.
                  example: 2
                other:
                  type: integer
                  description: Other SSL certificate verification errors.
                  example: 1
              example: {}
          example: {}
        max_conns:
          type: integer
          description: The <a href="https://nginx.org/en/docs/stream/ngx_stream_upstream_module.html#max_conns">max_conns</a> limit for the server.
          example: 0
        connections:
          type: integer
          description: The total number of client connections forwarded to this server.
          readOnly: true
          example: 0
        connect_time:
          type: integer
          description: The average time to connect to the upstream server.
          readOnly: true
          example: 0
        first_byte_time:
          type: integer
          description: The average time to receive the first byte of data.
          readOnly: true
          example: 0
        response_time:
          type: integer
          description: The average time to receive the last byte of data.
          readOnly: true
          example: 0
        sent:
          type: integer
          description: The total number of bytes sent to this server.
          readOnly: true
          example: 20183175459
        received:
          type: integer
          description: The total number of bytes received from this server.
          readOnly: true
          example: 180157219
        fails:
          type: integer
          description: The total number of unsuccessful attempts to communicate with the server.
          readOnly: true
          example: 0
        unavail:
          type: integer
          description: How many times the server became unavailable for client connections (state “<code>unavail</code>”) due to the number of unsuccessful attempts reaching the <a href="https://nginx.org/en/docs/stream/ngx_stream_upstream_module.html#max_fails">max_fails</a> threshold.
          readOnly: true
          example: 0
        health_checks:
          type: object
          readOnly: true
          properties:
            checks:
              type: integer
              description: The total number of <a href="https://nginx.org/en/docs/stream/ngx_stream_upstream_hc_module.html#health_check">health check</a> requests made.
              readOnly: true
              example: 0
            fails:
              type: integer
              description: The number of failed health checks.
              readOnly: true
              example: 0
            unhealthy:
              type: integer
              description: How many times the server became unhealthy (state “<code>unhealthy</code>”).
              readOnly: true
              example: 0
            last_passed:
              type: boolean
              description: Boolean indicating whether the last health check request was successful and passed <a href="https://nginx.org/en/docs/stream/ngx_stream_upstream_hc_module.html#match">tests</a>.
              readOnly: true
              example: false
          example: 0
        downtime:
          type: integer
          description: Total time the server was in the “<code>unavail</code>”, “<code>checking</code>”, and “<code>unhealthy</code>” states.
          readOnly: true
          example: 0
        downstart:
          type: string
          format: date-time
          description: The time when the server became “<code>unavail</code>”, “<code>checking</code>”, or “<code>unhealthy</code>”, in the ISO 8601 format with millisecond resolution.
          readOnly: true
          example: '2026-04-21T10:30:00.000Z'
        selected:
          type: string
          format: date-time
          description: The time when the server was last selected to process a connection, in the ISO 8601 format with millisecond resolution.
          readOnly: true
          example: '2026-04-21T10:30:00.000Z'
    NginxStreamUpstreamConfServer:
      title: Stream Upstream Server
      description: 'Dynamically configurable parameters of a stream upstream

        <a href="https://nginx.org/en/docs/stream/ngx_stream_upstream_module.html#server">server</a>:

        '
      type: object
      properties:
        id:
          type: integer
          description: The ID of the stream upstream server. The ID is assigned automatically and cannot be changed.
          readOnly: true
          example: 0
        server:
          type: string
          description: Same as the <a href="https://nginx.org/en/docs/stream/ngx_stream_upstream_module.html#server">address</a> parameter of the stream upstream server. When adding a server, it is possible to specify it as a domain name. In this case, changes of the IP addresses that correspond to a domain name will be monitored and automatically applied to the upstream configuration without the need of restarting nginx. This requires the <a href="https://nginx.org/en/docs/stream/ngx_stream_core_module.html#resolver">resolver</a> directive in the “<code>stream</code>” block. See also the <a href="https://nginx.org/en/docs/stream/ngx_stream_upstream_module.html#resolve">resolve</a> parameter of the stream upstream server.
          example: example-server
        service:
          type: string
          description: Same as the <a href="https://nginx.org/en/docs/stream/ngx_stream_upstream_module.html#service">service</a> parameter of the stream upstream server. This parameter cannot be changed.
          readOnly: true
          example: example-service
        weight:
          type: integer
          description: Same as the <a href="https://nginx.org/en/docs/stream/ngx_stream_upstream_module.html#weight">weight</a> parameter of the stream upstream server.
          example: 0
        max_conns:
          type: integer
          description: Same as the <a href="https://nginx.org/en/docs/stream/ngx_stream_upstream_module.html#max_conns">max_conns</a> parameter of the stream upstream server.
          example: 0
        max_fails:
          type: integer
          description: Same as the <a href="https://nginx.org/en/docs/stream/ngx_stream_upstream_module.html#max_fails">max_fails</a> parameter of the stream upstream server.
          example: 0
        fail_timeout:
          type: string
          description: Same as the <a href="https://nginx.org/en/docs/stream/ngx_stream_upstream_module.html#fail_timeout">fail_timeout</a> parameter of the stream upstream server.
          example: example-fail_timeout
        slow_start:
          type: string
          description: Same as the <a href="https://nginx.org/en/docs/stream/ngx_stream_upstream_module.html#slow_start">slow_start</a> parameter of the stream upstream server.
          example: example-slow_start
        backup:
          type: boolean
          description: When <code>true</code>, adds a <a href="https://nginx.org/en/docs/stream/ngx_stream_upstream_module.html#backup">backup</a> server. This parameter cannot be changed.
          readOnly: true
          example: false
        down:
          type: boolean
          description: Same as the <a href="https://nginx.org/en/docs/stream/ngx_stream_upstream_module.html#down">down</a> parameter of the stream upstream server.
          example: false
        parent:
          type: string
          description: Parent server ID of the resolved server. The ID is assigned automatically and cannot be changed.
          readOnly: true
          example: example-parent
        host:
          type: string
          description: Hostname of the resolved server. The hostname is assigned automatically and cannot be changed.
          readOnly: true
          example: example-host
      example:
        id: 0
        server: 10.0.0.1:12348
        weight: 1
        max_conns: 0
        max_fails: 1
        fail_timeout: 10s
        slow_start: 0
        backup: false
        down: false
    NginxStreamUpstreamPeerMap:
      title: Stream Upstream Servers
      description: Array of stream upstream servers.
      type: array
      items:
        $ref: '#/components/schemas/NginxStreamUpstreamPeer'
    NginxStreamUpstreamConfServerMap:
      title: Stream Upstream Servers
      description: 'An array of stream upstream servers for dynamic configuration.

        '
