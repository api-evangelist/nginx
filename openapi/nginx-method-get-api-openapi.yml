  NginxHTTPServerZone:
    title: HTTP Server Zone
    type: object
    properties:
      processing:
        type: integer
        description: The number of client requests that are currently being processed.
        example: 1
      requests:
        type: integer
        description: The total number of client requests received from clients.
        example: 31070465
      responses:
        description: The total number of responses sent to clients, the number of responses with status codes “<code>1xx</code>”, “<code>2xx</code>”, “<code>3xx</code>”, “<code>4xx</code>”, and “<code>5xx</code>”, and the number of responses per each status code.
        type: object
        readOnly: true
        properties:
          1xx:
            type: integer
            description: The number of responses with “<code>1xx</code>” status codes.
            readOnly: true
            example: 0
          2xx:
            type: integer
            description: The number of responses with “<code>2xx</code>” status codes.
            readOnly: true
            example: 0
          3xx:
            type: integer
            description: The number of responses with “<code>3xx</code>” status codes.
            readOnly: true
            example: 0
          4xx:
            type: integer
            description: The number of responses with “<code>4xx</code>” status codes.
            readOnly: true
            example: 0
          5xx:
            type: integer
            description: The number of responses with “<code>5xx</code>” status codes.
            readOnly: true
            example: 0
          codes:
            type: object
            description: The number of responses per each status code.
            readOnly: true
            properties:
              codeNumber:
                type: integer
                description: The number of responses with this particular status code.
                readOnly: true
                example: 0
            example: {}
          total:
            type: integer
            description: The total number of responses sent to clients.
            readOnly: true
            example: 98765
        example: 1234567
      discarded:
        type: integer
        description: The total number of requests completed without sending a response.
        example: 0
      received:
        type: integer
        description: The total number of bytes received from clients.
        example: 180157219
      sent:
        type: integer
        description: The total number of bytes sent to clients.
        example: 20183175459
      ssl:
        type: object
        readOnly: true
        properties:
          handshakes:
            type: integer
            description: The total number of successful SSL handshakes.
            readOnly: true
            example: 79572
          handshakes_failed:
            type: integer
            description: The total number of failed SSL handshakes.
            readOnly: true
            example: 21025
          session_reuses:
            type: integer
            description: The total number of session reuses during SSL handshake.
            readOnly: true
            example: 15762
          no_common_protocol:
            type: integer
            description: The number of SSL handshakes failed because of no common protocol.
            example: 4
          no_common_cipher:
            type: integer
            description: The number of SSL handshakes failed because of no shared cipher.
            example: 2
          handshake_timeout:
            type: integer
            description: The number of SSL handshakes failed because of a timeout.
            example: 0
          peer_rejected_cert:
            type: integer
            description: The number of failed SSL handshakes when nginx presented the certificate to the client but it was rejected with a corresponding alert message.
            example: 0
          verify_failures:
            type: object
            description: SSL certificate verification errors
            properties:
              no_cert:
                type: integer
                description: A client did not provide the required certificate.
                example: 0
              expired_cert:
                type: integer
                description: An expired or not yet valid certificate was presented by a client.
                example: 2
              revoked_cert:
                type: integer
                description: A revoked certificate was presented by a client.
                example: 1
              other:
                type: integer
                description: Other SSL certificate verification errors.
                example: 1
            example: {}
        example: {}
    example:
