        '404':
          description: Unknown version (*UnknownVersion*)
          schema:
            $ref: '#/definitions/NginxError'
          examples:
            application/json:
              error: {}
              request_id: example-request_id
              href: example-href
          x-microcks-refs:
          - name: getSsl404Example
            x-microcks-default: true
      parameters:
      - in: query
        name: fields
        type: string
        description: Limits which fields of SSL statistics will be output.
        x-example: ''
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /license:
    get:
      tags:
      - Method GET
      summary: NGINX Return License Info
      operationId: getLicense
      produces:
      - application/json
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/NginxLicenseObject'
          examples:
            application/json:
              eval: false
              active_till: 1749268757
              reporting:
                healthy: true
                fails: 2
                grace: 15551961
                uuid: 13754cba-29fb-53e5-c32e-a6cf57c84b01
          x-microcks-refs:
          - name: getLicense200Example
            x-microcks-default: true
        '404':
          description: Unknown version (*UnknownVersion*)
          schema:
            $ref: '#/definitions/NginxError'
          examples:
            application/json:
              error: {}
              request_id: example-request_id
              href: example-href
          x-microcks-refs:
          - name: getLicense404Example
            x-microcks-default: true
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /workers/:
    get:
      tags:
      - Method GET
      summary: NGINX Return Statistics for All Worker Processes
      description: Returns statistics for all worker processes such as accepted, dropped, active, idle connections, total and current requests.
      operationId: getWorkers
      produces:
      - application/json
      parameters:
      - in: query
        name: fields
        type: string
        description: Limits which fields of worker process statistics will be output.
        x-example: ''
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/NginxWorkersMap'
          examples:
            application/json:
            - id: 0
              pid: 32212
              connections:
                accepted: 1
                dropped: 0
                active: 1
                idle: 0
              http:
                requests:
                  total: 19
                  current: 1
            - id: 1
              pid: 32214
              connections:
                accepted: 1
                dropped: 0
                active: 1
                idle: 0
              http:
                requests:
                  total: 15
                  current: 0
          x-microcks-refs:
          - name: getWorkers200Example
            x-microcks-default: true
        '404':
          description: 'Worker not found (*WorkerNotFound*),

            unknown version (*UnknownVersion*)

            '
          schema:
            $ref: '#/definitions/NginxError'
          examples:
            application/json:
              error: {}
              request_id: example-request_id
              href: example-href
          x-microcks-refs:
          - name: getWorkers404Example
            x-microcks-default: true
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /workers/{workerId}:
    parameters:
    - name: workerId
      in: path
      description: The ID of the worker process.
      required: true
      type: string
      x-example: example_workerId
    get:
      tags:
      - Method GET
      summary: NGINX Return Status of a Worker Process
      description: Returns status of a particular worker process.
      operationId: getWorker
      produces:
      - application/json
      parameters:
      - in: query
        name: fields
        type: string
        description: Limits which fields of worker process statistics will be output.
        x-example: ''
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/NginxWorker'
          examples:
            application/json:
              id: 0
              pid: 32212
              connections:
                accepted: 1
                dropped: 0
                active: 1
                idle: 0
              http:
                requests:
                  total: 15
                  current: 1
          x-microcks-refs:
          - name: getWorker200Example
            x-microcks-default: true
        '404':
          description: 'Worker not found (*WorkerNotFound*),

            unknown version (*UnknownVersion*)

            '
          schema:
            $ref: '#/definitions/NginxError'
          examples:
            application/json:
              error: {}
              request_id: example-request_id
              href: example-href
          x-microcks-refs:
          - name: getWorker404Example
            x-microcks-default: true
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
definitions:
  ArrayOfStrings:
    title: Array
    description: 'An array of strings.

      '
    type: array
    items:
      type: string
  NginxConnections:
    title: Connections
    description: 'The number of accepted, dropped, active, and idle connections.

      '
    type: object
    properties:
      accepted:
        type: integer
        description: The total number of accepted client connections.
        example: 4968119
      dropped:
        type: integer
        description: The total number of dropped client connections.
        example: 0
      active:
        type: integer
        description: The current number of active client connections.
        example: 5
      idle:
        type: integer
        description: The current number of idle client connections.
        example: 117
    example:
      accepted: 4968119
      dropped: 0
      active: 5
      idle: 117
  NginxSlabZone:
    title: Shared memory zone with slab allocator
    description: 'Shared memory zone with slab allocator

      '
    type: object
    properties:
      pages:
        type: object
        description: The number of free and used memory pages.
        properties:
          used:
            type: integer
            description: The current number of used memory pages.
            example: 0
          free:
            type: integer
            description: The current number of free memory pages.
            example: 0
        example: {}
      slots:
        type: object
        title: Memory Slots
        description: Status data for memory slots (8, 16, 32, 64, 128, etc.)
        additionalProperties:
          $ref: '#/definitions/NginxSlabZoneSlot'
        example: {}
    example:
      pages:
        used: 1143
        free: 2928
      slots:
        8:
          used: 0
          free: 0
          reqs: 0
          fails: 0
        16:
          used: 0
          free: 0
          reqs: 0
          fails: 0
        32:
          used: 0
          free: 0
          reqs: 0
          fails: 0
        64:
          used: 1
          free: 63
          reqs: 1
          fails: 0
        128:
          used: 0
          free: 0
          reqs: 0
          fails: 0
        256:
          used: 18078
          free: 178
          reqs: 1635736
          fails: 0
  NginxHTTPLimitReqZonesMap:
    title: HTTP limit_reqs
    description: 'Status data for all HTTP

      <a href="https://nginx.org/en/docs/http/ngx_http_limit_req_module.html#limit_req_zone">limit_req zones</a>.

      '
    type: object
    additionalProperties:
      $ref: '#/definitions/NginxHTTPLimitReqZone'
  NginxSlabZoneSlot:
    title: Memory Slot
    type: object
    properties:
      used:
        type: integer
        description: The current number of used memory slots.
        example: 0
      free:
        type: integer
        description: The current number of free memory slots.
        example: 0
      reqs:
        type: integer
        description: The total number of attempts to allocate memory of specified size.
        example: 0
      fails:
        type: integer
        description: The number of unsuccessful attempts to allocate memory of specified size.
        example: 0
  NginxLicenseObject:
    title: License
    description: 'License and usage reporting status of NGINX Plus instance.

      '
    properties:
      eval:
        type: boolean
        description: Indicates whether NGINX Plus license is trial.
        readOnly: true
        example: false
      active_till:
        type: integer
        description: The Unix timestamp of license expiration.
        readOnly: true
        example: 0
      reporting:
        type: object
        properties:
          healthy:
            type: boolean
            description: Indicates whether the reporting state is still considered healthy despite recent failed attempts.
            readOnly: true
            example: false
          fails:
            type: integer
            description: The number of failed reporting attempts, reset each time the usage report is successfully sent.
            readOnly: true
            example: 0
          grace:
            type: integer
            description: The number of seconds before traffic processing is stopped after unsuccessful report attempt.
            readOnly: true
            example: 0
          uuid:
            type: string
            description: The ID of NGINX Plus instance in the UUID format.
            readOnly: true
            example: example-uuid
        example: {}
    example:
      eval: false
      active_till: 1749268757
      reporting:
        healthy: true
        fails: 2
        grace: 15551961
        uuid: 13754cba-29fb-53e5-c32e-a6cf57c84b01
  NginxStreamLimitConnZonesMap:
    title: Stream limit_conns
    description: 'Status data for all stream

      <a href="https://nginx.org/en/docs/stream/ngx_stream_limit_conn_module.html#limit_conn_zone">limit_conn zones</a>.

      '
    type: object
    additionalProperties:
      $ref: '#/definitions/NginxStreamLimitConnZone'
  NginxHTTPCachesMap:
    title: HTTP Caches
    description: "Status information of all HTTP caches configured by \n<a href=\"https://nginx.org/en/docs/http/ngx_http_proxy_module.html#proxy_cache_path\">proxy_cache_path</a>\nand other “<code>*_cache_path</code>” directives.\n"
