naftiko: 1.0.0-alpha2
info:
  label: NGINX Plus REST API — Stream
  description: 'NGINX Plus REST API — Stream. 1 operations. Lead operation: NGINX Return List of Stream-Related Endpoints.
    Self-contained Naftiko capability covering one Nginx business surface.'
  tags:
  - Nginx
  - Stream
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    NGINX_API_KEY: NGINX_API_KEY
capability:
  consumes:
  - type: http
    namespace: plus-http-stream
    baseUri: ''
    description: NGINX Plus REST API — Stream business capability. Self-contained, no shared references.
    resources:
    - name: stream
      path: /stream/
      operations:
      - name: getstream
        method: GET
        description: NGINX Return List of Stream-Related Endpoints
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: plus-http-stream-rest
    port: 8080
    description: REST adapter for NGINX Plus REST API — Stream. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/stream
      name: stream
      description: REST surface for stream.
      operations:
      - method: GET
        name: getstream
        description: NGINX Return List of Stream-Related Endpoints
        call: plus-http-stream.getstream
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: plus-http-stream-mcp
    port: 9090
    transport: http
    description: MCP adapter for NGINX Plus REST API — Stream. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: nginx-return-list-stream-related
      description: NGINX Return List of Stream-Related Endpoints
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: plus-http-stream.getstream
      outputParameters:
      - type: object
        mapping: $.
