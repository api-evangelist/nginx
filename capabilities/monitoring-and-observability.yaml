          type: object
          value: $.
      - name: reset-connections
        method: DELETE
        description: Reset client connections statistics
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: slabs
      path: /slabs
      description: Shared memory slab allocator statistics
      operations:
