    namespace: plus-http-workers
    baseUri: ''
    description: NGINX Plus REST API — Workers business capability. Self-contained, no shared references.
    resources:
    - name: workers
      path: /workers/
      operations:
      - name: getworkers
        method: GET
        description: NGINX Return Statistics for All Worker Processes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: fields
          in: query
          type: string
          description: Limits which fields of worker process statistics will be output.
      - name: deleteworkersstat
        method: DELETE
        description: NGINX Reset Statistics for All Worker Processes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: workers-workerId
      path: /workers/{workerId}
      operations:
      - name: getworker
        method: GET
        description: NGINX Return Status of a Worker Process
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: fields
          in: query
          type: string
          description: Limits which fields of worker process statistics will be output.
      - name: deleteworkerstat
        method: DELETE
        description: NGINX Reset Statistics for a Worker Process
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
