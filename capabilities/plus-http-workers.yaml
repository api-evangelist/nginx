    - path: /v1/workers
      name: workers
      description: REST surface for workers.
      operations:
      - method: GET
        name: getworkers
        description: NGINX Return Statistics for All Worker Processes
        call: plus-http-workers.getworkers
        with:
          fields: rest.fields
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteworkersstat
        description: NGINX Reset Statistics for All Worker Processes
        call: plus-http-workers.deleteworkersstat
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/workers/{workerid}
      name: workers-workerid
      description: REST surface for workers-workerId.
      operations:
      - method: GET
        name: getworker
        description: NGINX Return Status of a Worker Process
        call: plus-http-workers.getworker
        with:
          fields: rest.fields
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteworkerstat
        description: NGINX Reset Statistics for a Worker Process
        call: plus-http-workers.deleteworkerstat
        outputParameters:
        - type: object
          mapping: $.
