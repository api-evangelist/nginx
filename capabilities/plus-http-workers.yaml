naftiko: 1.0.0-alpha2
info:
  label: NGINX Plus REST API — Workers
  description: 'NGINX Plus REST API — Workers. 4 operations. Lead operation: NGINX Return Statistics for All Worker Processes.
    Self-contained Naftiko capability covering one Nginx business surface.'
  tags:
  - Nginx
  - Workers
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    NGINX_API_KEY: NGINX_API_KEY
capability:
